{% extends 'base.html' %}

{% block content %}
<h2 style="color: rgb(200, 215, 112);">Create Post</h2>

<form method="POST" action="/create" style="display: flex; flex-direction: column; gap: 10px;">
    <input type="text" name="title" placeholder="Enter title" required>
    
    <textarea name="content" placeholder="Enter content" required></textarea>
    
    <button type="submit">Post</button>
</form>

{% endblock %}
