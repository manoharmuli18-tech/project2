{% extends 'base.html' %}

{% block content %}
<a href="/create" class="btn btn-primary mb-3">Create Post</a>

{% for post in posts %}
<div class="card mb-3">
    <div class="card-body">
        <h4>{{ post[1] }}</h4>
        <p>{{ post[2] }}</p>
        <a href="/edit/{{ post[0] }}" class="btn btn-warning">Edit</a>
        <form method="POST" action="/delete/{{ post[0] }}" style="display: inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this post?')">Delete</button>
        </form>
    </div>
</div>
{% endfor %}

{% endblock %}
