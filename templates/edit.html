{% extends 'base.html' %}

{% block content %}
<h2>Edit Post</h2>

<form method="POST">
    <input type="text" name="title" value="{{ post[1] }}" class="form-control mb-2">
    <textarea name="content" class="form-control mb-2">{{ post[2] }}</textarea>
    <button class="btn btn-success">Update</button>
</form>

{% endblock %}
